<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✎ 换个称呼 · 七夕星河予你</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #f3e5f5 0%, #e1bee7 100%);
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 36px 30px;
            box-shadow: 0 30px 60px rgba(156, 39, 176, 0.20), inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
        }
        h1 { font-size: 1.8rem; color: #7b1fa2; margin-bottom: 6px; }
        .sub { color: #6a1b9a; opacity: 0.8; margin-bottom: 24px; }
        label { display: block; text-align: left; color: #4a1a2c; font-size: 0.95rem; margin-bottom: 8px; }
        input[type="text"] {
            width: 100%;
            font-size: 1.2rem;
            padding: 12px 16px;
            border: 2px solid rgba(156, 39, 176, 0.25);
            border-radius: 16px;
            outline: none;
            font-family: inherit;
            margin-bottom: 16px;
        }
        input[type="text"]:focus { border-color: #ab47bc; }
        .preview {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
            color: #4a1a2c;
            line-height: 1.6;
        }
        .preview strong { color: #7b1fa2; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            padding: 11px 22px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            box-shadow: 0 8px 18px rgba(156, 39, 176, 0.25);
        }
        button.ghost { background: rgba(255, 255, 255, 0.75); color: #6d4c5a; border: 1.5px solid rgba(156, 39, 176, 0.2); }
        .out { margin-top: 18px; text-align: left; }
        .out p { font-size: 0.8rem; color: #9a6b7c; margin-bottom: 6px; }
        .out input {
            width: 100%;
            font-size: 0.82rem;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(156, 39, 176, 0.2);
            border-radius: 12px;
            color: #4a1a2c;
            background: #fff;
        }
        .note { margin-top: 18px; font-size: 0.8rem; color: #9a6b7c; line-height: 1.7; }
        .back { margin-top: 16px; display: inline-block; font-size: 0.85rem; color: #7b1fa2; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✎ 换个称呼</h1>
        <p class="sub">改一个名字，生成一条专属链接</p>
        <label for="name">称呼（会显示在信的开头）</label>
        <input type="text" id="name" maxlength="20" placeholder="例如：张三" />
        <div class="preview">亲爱的 <strong id="preview">张三</strong> ：今夜银河倾泻…</div>
        <div class="row">
            <button id="gen">生成链接</button>
            <button class="ghost" id="copy">复制链接</button>
            <button class="ghost" id="local">设为本机默认</button>
        </div>
        <div class="out" id="out" hidden>
            <p>专属链接（推荐发送这个）</p>
            <input id="link" readonly onclick="this.select()" />
            <p>路径式链接（访问这个路径也会自动跳到内容）</p>
            <input id="pathLink" readonly onclick="this.select()" />
        </div>
        <p class="note">名字会直接写在链接里，谁打开链接就看到对应的称呼，无需服务器存储。<br />“设为本机默认”只对当前手机/电脑生效。</p>
        <a class="back" href="./">← 返回七夕页面</a>
    </div>
    <script>
        (function () {
            const base = location.pathname.replace(/edit\.html$/, '');
            const el = document.getElementById('name');
            const preview = document.getElementById('preview');
            const out = document.getElementById('out');
            const link = document.getElementById('link');
            const pathLink = document.getElementById('pathLink');
            function current() {
                const v = el.value.trim();
                return v || '张三';
            }
            el.addEventListener('input', function () {
                preview.textContent = current();
                out.hidden = true;
            });
            function makeLinks() {
                const name = current();
                return [
                    location.origin + base + '?name=' + encodeURIComponent(name),
                    location.origin + base + encodeURIComponent(name)
                ];
            }
            document.getElementById('gen').addEventListener('click', function () {
                const links = makeLinks();
                link.value = links[0];
                pathLink.value = links[1];
                out.hidden = false;
            });
            document.getElementById('copy').addEventListener('click', function () {
                const q = makeLinks()[0];
                const done = function () { alert('链接已复制，去发给 TA 吧 💌'); };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(q).then(done);
                } else {
                    link.value = q;
                    link.select();
                    document.execCommand('copy');
                    done();
                }
            });
            document.getElementById('local').addEventListener('click', function () {
                try { localStorage.setItem('qixi_name', current()); } catch (e) {}
                location.href = location.origin + base;
            });
            // 如果通过带名字的链接进入，自动预填
            try {
                const q = new URLSearchParams(location.search).get('name');
                if (q) { el.value = q; preview.textContent = q; }
            } catch (e) {}
        })();
    </script>
</body>
</html>
